name: Clan-Daten aktualisieren

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
        run: python scripts/fetch.py
      - name: Speichern
        run: |
          git config user.name "clan-board-bot"
          git config user.email "clan-board-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ü40 Pur Clan-Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 2l12 6v8c0 7-5 12-12 14C9 28 4 23 4 16V8z%27 fill=%27%23b5651d%27/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f1ea;--card:#fffdf8;--ink:#1f1d1a;--mut:#6d675e;--line:#e3ddd1;
  --acc:#b5651d;--acc2:#2f5d8a;--ok:#2e7d4f;--warn:#c58a00;--bad:#b23a2e;--chip:#efe9dd;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171b;--card:#1d2026;--ink:#ece8e1;--mut:#9a958c;--line:#2d313a;
  --acc:#e0913f;--acc2:#6fa3d6;--ok:#4fb47a;--warn:#e2b23c;--bad:#e0675a;--chip:#272b33;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:10px 16px 8px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:22px;letter-spacing:.2px}
h2{font-size:17px;margin:0 0 10px}
.sub{color:var(--mut);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--mut);font-size:12px}
.clanhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.clanhead img{width:52px;height:52px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
thead th{position:sticky;top:0;background:var(--chip);cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);user-select:none}
thead th:first-child{z-index:2;background:var(--chip)}
thead th.sorted{color:var(--ink)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--chip)}
:root{--openbg:#fbe3c4}
@media (prefers-color-scheme:dark){:root{--openbg:#4a3418}}
tbody tr.openrow td{background:var(--openbg)}
.bonustab .l{text-align:left}
tbody tr.openrow:hover td{background:var(--openbg);filter:brightness(.97)}
.openbadge{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--acc);border-radius:999px;padding:0 7px;margin-left:4px}
.name{font-weight:600}
.role{font-size:11px;color:var(--mut);margin-left:4px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
/* Ampel = Kriegsbereitschaft im Spiel */
.ampel{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle}.ampel.ag{background:#2ecc40}.ampel.ar{background:#ff3b30}
.g{background:var(--ok)}.y{background:var(--warn)}.r{background:var(--bad)}.n{background:var(--line)}
.raiddots span{display:inline-block;width:9px;height:9px;border-radius:2px;margin-left:2px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--chip)}
.pill.ok{background:var(--ok);color:#fff}.pill.bad{background:var(--bad);color:#fff}
.reload{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;margin-left:8px;cursor:pointer}
.reload:disabled{opacity:.6}
.reload.okbtn{background:var(--ok);border-color:var(--ok);color:#fff}
.reload.act{font-size:16px;padding:11px 20px;min-height:46px;margin:4px 8px 4px 0}
input[data-f][type=checkbox]{width:26px;height:26px;vertical-align:middle;cursor:pointer;accent-color:var(--ok)}
input[data-f][type=number],input[data-pin]{font:inherit;font-size:17px;padding:9px 12px;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[data-f][type=number]{width:90px!important}
input[data-pin]{width:230px!important;font-size:28px!important;letter-spacing:8px;text-align:center;border:2px solid var(--acc)!important;min-height:56px!important}
.saverow{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pinbox{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--openbg);border:2px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:6px}
.pinbox b{font-size:18px}
.pincount{font-size:16px;font-weight:600;min-width:130px}
.pinbox.ok{background:var(--chip);border-color:var(--ok)}
.pill.warn{background:var(--warn);color:#fff}
.pill.big{font-size:14px;font-weight:600;padding:3px 10px}
.benchright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;white-space:nowrap}
select.bigsel{font:inherit;font-size:17px;padding:9px 12px;min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.volgrid label{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:16px;cursor:pointer}
.fdedit td{padding-top:10px;padding-bottom:10px}
.sieg{color:var(--ok)}.niederlage{color:var(--bad)}.unentschieden{color:var(--warn)}
.list{margin:0;padding:0;list-style:none}
.list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.muted{color:var(--mut)}
.open-attacks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.open-attacks span{background:var(--chip);border-radius:6px;padding:3px 8px;font-size:13px}
.warbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-size:26px;font-weight:700}
.legend{font-size:12px;color:var(--mut);margin-top:8px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px}
.dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin-top:10px}
.dl span:nth-child(odd){color:var(--mut)}
.close{float:right;border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer}
.err{color:var(--bad)}
.thdist{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
details summary{cursor:pointer;list-style-position:outside}
input[type=search]{width:100%;max-width:280px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.banner{position:relative;overflow:hidden;color:#fff7e6;border-bottom:3px solid #e6b43c;background:#2a0f2e url("img/coc-banner.webp") center 32%/cover no-repeat}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,6,24,.88) 0%,rgba(18,6,24,.62) 38%,rgba(18,6,24,.08) 70%,rgba(18,6,24,.25) 100%)}
.banner-in{max-width:1200px;margin:0 auto;padding:22px 16px;min-height:190px;display:flex;align-items:center;gap:22px;position:relative;z-index:1}
.coc-logo{height:120px;width:auto;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.titel{border-left:2px solid rgba(230,180,60,.7);padding-left:20px}
.banner h1{font-size:40px;line-height:1.1;color:#fff7e6;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.banner .claim{font-size:15px;margin-top:4px;color:#f3d991;text-shadow:0 1px 3px rgba(0,0,0,.8)}
@media (max-width:640px){.banner-in{min-height:0;padding:16px;gap:14px}.coc-logo{height:62px}.titel{padding-left:12px}.banner h1{font-size:23px}.banner .claim{display:none}}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;font-size:11px;color:var(--mut)}
.note-swap{margin-top:10px;padding:8px 12px;border-left:3px solid #e8833a;background:rgba(232,131,58,.12);border-radius:4px}.note-swap ul{margin:4px 0 0;padding-left:18px}
</style>
</head>
<body>
<div class="banner">
  <div class="banner-in">
    <img class="coc-logo" src="img/coc-logo.webp" alt="Clash of Clans">
    <div class="titel">
      <h1>Ü40 Pur <span style="white-space:nowrap">Clan-Board</span></h1>
      <div class="claim">Ü40 Pur &amp; Ü40 Pur 2</div>
    </div>
  </div>
</div>
<header>
  <div class="sub"><span id="updated">Lade Daten …</span><button class="reload" id="reload" type="button" onclick="load(true)">Aktualisieren</button></div>
  <div class="tabs" id="clanTabs"></div>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<footer>This material is unofficial and is not endorsed by Supercell. For more information see Supercell's Fan Content Policy: <a href="https://www.supercell.com/fan-content-policy" style="color:inherit">www.supercell.com/fan-content-policy</a>.</footer>

<script>
const S = {data:null, clan:0, view:'mitglieder', sort:{key:'name',dir:1}, q:'', fd:{}, edit:{}, pending:[], msg:{}, pin:{}, forms:{}, saves:{}};
const ROLE = {leader:'Anführer', coLeader:'Vize', admin:'Ältester', member:''};
const fmtN = n => n==null ? '–' : Number(n).toLocaleString('de-DE');
const pct = (a,b) => b ? Math.round(a/b*100) : null;
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseT(s){
  if(!s) return null;
  if(/^\d{8}T/.test(s)) s = s.replace(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d).*$/, '$1-$2-$3T$4:$5:$6Z');
  return new Date(s);
}
function ago(s){
  const d = parseT(s); if(!d) return '–';
  const m = (Date.now()-d)/60000;
  if(m < 60) return 'vor ' + Math.max(1,Math.round(m)) + ' Min.';
  if(m < 1440) return 'vor ' + Math.round(m/60) + ' Std.';
  return 'vor ' + Math.round(m/1440) + ' Tg.';
}
function until(s){
  const d = parseT(s); if(!d) return '';
  const m = (d-Date.now())/60000;
  if(m <= 0) return 'beendet';
  const h = Math.floor(m/60), mm = Math.floor(m%60);
  return h ? `noch ${h} Std. ${mm} Min.` : `noch ${mm} Min.`;
}
function dateDE(s){ const d=parseT(s); return d ? d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '–'; }

// Vergessene Angriffe in den letzten 10 Kriegen, als Text statt Punkt (Sven, 07.11.: nicht mit der Ampel verwechseln)
// Kriegsbereitschaft, die der Spieler im Spiel selbst stellt
function warPrefOf(tag){
  for(const c of S.data.clans){ const m = c.memberList.find(x => x.tag === tag); if(m) return (m.profile||{}).warPreference || null; }
  return null;
}
const ampelHtml = p => p === 'in' ? '<span class="ampel ag" title="Kriegsbereitschaft im Spiel: grün"></span>'
  : p === 'out' ? '<span class="ampel ar" title="Kriegsbereitschaft im Spiel: rot"></span>' : '<span class="muted">–</span>';

function rows(){
  const d = S.data; if(!d) return [];
  const clans = S.clan === 'alle' ? d.clans : [d.clans[S.clan]];
  let out = [];
  clans.forEach(c => {
    const cw = c.currentWar, openMap = {};
    if(cw && cw.state === 'inWar') (cw.members||[]).forEach(x => { if(x.attacks.length < cw.apm) openMap[x.tag] = cw.apm - x.attacks.length; });
    c.memberList.forEach(m => {
    const w = m.war || {};
    out.push(Object.assign({}, m, {
      clanName: c.name,
      openNow: openMap[m.tag] || 0,
      missed: w.recentMissed ?? -1,
      warPref: (m.profile||{}).warPreference === 'in' ? 1 : (m.profile||{}).warPreference === 'out' ? 0 : -1,
      usage: pct(w.attacks||0, w.possible||0),
      avgStars: w.attacks ? w.stars/w.attacks : null,
      triple: pct(w.triples||0, w.attacks||0),
      defAvg: w.defs ? w.defStars/w.defs : null,
      boostsN: (m.boosts||[]).length,
      ratio: m.received ? m.donations/m.received : (m.donations ? 99 : null),
      raidAtt: m.raids.reduce((a,r)=>a+r.attacks,0),
      activeTs: m.lastActive ? parseT(m.lastActive).getTime() : 0,
      joinTs: m.joinedAt && m.joinedAt !== BOARD_START ? parseT(m.joinedAt).getTime() : 0,
    }));
    });
  });
  if(S.q){ const q=S.q.toLowerCase(); out = out.filter(r => r.name.toLowerCase().includes(q) || r.tag.toLowerCase().includes(q)); }
  const k = S.sort.key, dir = S.sort.dir;
  out.sort((a,b) => {
    let x=a[k], y=b[k];
    if(typeof x === 'string' || typeof y === 'string') return dir * String(x??'').localeCompare(String(y??''),'de');
    x = x ?? -Infinity; y = y ?? -Infinity;
    return dir * (x - y);
  });
  return out;
}

function renderTabs(){
  const t = document.getElementById('clanTabs');
  const btns = S.data.clans.map((c,i) => `<button data-clan="${i}" class="${S.clan===i?'on':''}">${esc(c.name||c.tag)}</button>`);
  btns.push(`<button data-clan="alle" class="${S.clan==='alle'?'on':''}">Beide Clans</button>`);
  t.innerHTML = btns.join('');
  t.onclick = e => { const b=e.target.closest('button'); if(!b) return; S.clan = b.dataset.clan==='alle'?'alle':+b.dataset.clan; save(); render(); };
}

function thDist(list){
  const n = {}; list.forEach(m => { if(m.th) n[m.th] = (n[m.th]||0) + 1; });
  return Object.keys(n).sort((a,b)=>b-a).map(t => `<span class="pill">RH${t}: ${n[t]}</span>`).join(' ');
}

function clanHead(c){
  const games = c.memberList.reduce((a,m)=>a+(m.games||0),0);
  return `<div class="card">
    <div class="clanhead">${c.badge?`<img src="${esc(c.badge)}" alt="">`:''}
      <div><h2 style="margin:0">${esc(c.name)} <span class="muted" style="font-weight:400;font-size:13px">${esc(c.tag)}</span></h2>
      <div class="sub">Level ${fmtN(c.level)} · ${esc(c.warLeague||'')} · Clanstadt ${esc(c.capitalLeague||'')}</div></div></div>
    <div class="grid">
      <div class="kpi"><b>${fmtN(c.members)}/50</b><span>Mitglieder</span></div>
      <div class="kpi"><b>${fmtN(c.warWins)}</b><span>Kriegssiege${c.warLosses!=null?` · ${fmtN(c.warLosses)} Niederl.`:''}</span></div>
      <div class="kpi"><b>${fmtN(c.warWinStreak)}</b><span>Siegesserie</span></div>
      <div class="kpi"><b>${fmtN(c.points)}</b><span>Clanpunkte</span></div>
      <div class="kpi"><b>${fmtN(games)}</b><span>Clanspiele (Monat)</span></div>
    </div>
    <div class="thdist"><span class="muted">Rathäuser:</span> ${thDist(c.memberList)}</div>
    ${ligaLine(c)}
    ${c.isWarLogPublic===false?'<p class="err">Kriegsprotokoll ist privat. In den Clan-Einstellungen auf öffentlich stellen, sonst fehlen Kriegsdaten.</p>':''}
  </div>`;
}

function liveWar(c){
  const w = c.currentWar;
  if(!w) return `<div class="card"><h2>Aktueller Krieg</h2><span class="muted">Gerade kein Krieg.</span></div>`;
  const label = {preparation:'Vorbereitung', inWar:'Kampftag läuft', warEnded:'Beendet'}[w.state] || w.state;
  const open = (w.members||[]).filter(m => m.attacks.length < w.apm).sort((a,b)=>a.pos-b.pos);
  const time = w.state==='preparation' ? 'Start ' + until(w.start).replace('noch ','in ') : until(w.end);
  return `<div class="card"><h2>${w.kind==='cwl'?'Clankriegsliga':'Clankrieg'}: ${label}</h2>
    <div class="warbar"><span class="score">${w.us.stars} : ${w.opponent.stars}</span>
      <span>gegen <b>${esc(w.opponent.name)}</b><br><span class="muted">${w.us.pct.toFixed(1)} % : ${w.opponent.pct.toFixed(1)} % · ${w.teamSize} gegen ${w.teamSize} · ${time}</span></span></div>
    ${w.state!=='preparation' ? `<div style="margin-top:10px"><b>${open.length? 'Noch Angriffe offen ('+open.length+')':'Alle haben angegriffen'}</b>
      <div class="open-attacks">${open.map(m=>`<span>${m.pos}. ${esc(m.name)} · RH${m.th} · ${w.apm-m.attacks.length} offen</span>`).join('')}</div></div>` : ''}
  </div>`;
}

// Mitglieder (Sven, 11.11.): ohne Vergessen, Clanstadt, Clanspiele, Supertruppen; Werte mittig
const COLS = [
  ['name','Spieler'],['warPref','Ampel'],['th','RH'],['usage','Angriffe genutzt'],['avgStars','Ø Sterne'],
  ['triple','3-Sterne-Quote'],['defAvg','Ø Sterne kassiert'],['donations','Gespendet'],['received','Erhalten'],['ratio','Quote'],
  ['activeTs','Zuletzt aktiv'],['joinTs','Im Clan seit'],
];

function memberTable(){
  if(!COLS.some(([k]) => k === S.sort.key)) S.sort = {key: 'name', dir: 1};
  const rs = rows();
  const multi = S.clan === 'alle';
  const head = COLS.map(([k,l]) => `<th data-k="${k}" class="${S.sort.key===k?'sorted':''}">${l}${S.sort.key===k?(S.sort.dir>0?' ▲':' ▼'):''}</th>`).join('');
  const body = rs.map(r => {
    return `<tr data-tag="${esc(r.tag)}" data-clan="${esc(r.clanName)}" class="${r.openNow?'openrow':''}" ${r.openNow?`title="${r.openNow} Angriff(e) im laufenden Krieg offen"`:''}>
      <td><span class="name">${esc(r.name)}</span><span class="role">${ROLE[r.role]||''}</span>${r.openNow?` <span class="openbadge">${r.openNow} offen</span>`:''}${multi?`<div class="muted" style="font-size:11px">${esc(r.clanName)}</div>`:''}</td>
      <td>${ampelHtml((r.profile||{}).warPreference)}</td>
      <td>${r.th??'–'}</td>
      <td>${r.usage==null?'–':r.usage+' %'}</td>
      <td>${r.avgStars==null?'–':r.avgStars.toFixed(2)}</td>
      <td>${r.triple==null?'–':r.triple+' %'}</td>
      <td title="${r.war&&r.war.defs?r.war.defs+' Verteidigungen, '+r.war.defTriples+'x 3 Sterne kassiert':''}">${r.defAvg==null?'–':r.defAvg.toFixed(2)}</td>
      <td>${fmtN(r.donations)}</td><td>${fmtN(r.received)}</td>
      <td>${r.ratio==null?'–':(r.ratio>=99?'∞':r.ratio.toFixed(2))}</td>
      <td>${r.lastActive?ago(r.lastActive):'<span class="muted">noch offen</span>'}</td>
      <td>${joinDE(r)}</td>
    </tr>`;
  }).join('');
  return `<div class="card"><input type="search" placeholder="Spieler suchen" value="${esc(S.q)}" id="q">
    <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend">Orange hinterlegt = hat im laufenden Krieg noch Angriffe offen. Ampel = Kriegsbereitschaft, die der Spieler im Spiel selbst stellt (grün/rot, wird alle 30 Minuten abgefragt). – = noch keine Daten.
    Spenden zählen seit Saisonbeginn. „Zuletzt aktiv“ leitet sich aus Änderungen am Spielerprofil ab (Spenden, Siege, Upgrades, Erfolge), die API liefert keinen Online-Status. Spaltenkopf antippen zum Sortieren, Zeile antippen für Details.</div></div>`;
}

function regularBench(c){
  const rr = c.regularRounds || [];
  const roster = c.memberList.filter(m => (m.profile||{}).warPreference === 'in').map(m => ({tag:m.tag, name:m.name}));
  const lastPast = rr.filter(r => r.state !== 'preparation').slice(-1)[0] || {};
  const key = lastPast.end ? 'krieg:' + lastPast.end : null;
  const vol = key ? ((S.fd[c.tag] || {}).freiwillig || {})[key] : null;
  return benchCard(`Aussetz-Empfehlung ${esc(c.name)} für den nächsten Krieg`, benchCalc(rr, roster, lastPast.teamSize, vol, null, FAIR_ONLY.includes(c.tag)), 'Krieg',
                   key ? {clan: c.tag, key, label: 'den nächsten Krieg'} : null);
}

// Mitglieder im Krieg (Sven, 12.11.2026): 1./2. Angriff, Verteidigung, wie oft angegriffen,
// ob beim ersten Versuch gedreiert. Laufender Krieg, sonst der zuletzt beendete.
function dreierText(defs){
  if(!defs || !defs.length) return '<span class="muted">nicht angegriffen</span>';
  const mitOrder = defs.every(d => d.order != null);
  const ds = mitOrder ? defs.slice().sort((a,b) => a.order - b.order) : defs;
  const i = ds.findIndex(d => d.stars === 3);
  if(i < 0) return 'nicht gedreiert';

}

// Rathaus-Vergleich Angreifer zu Gegner (Kerstin, 11.11.): pro Angriff und als Zählung in der Liga-Rangliste.
const rhDiff = (own, opp) => { if(!own || !opp) return ''; const d = opp - own;
  return d > 0 ? ' (+' + d + ')' : d < 0 ? ' (−' + (-d) + ')' : ' (gleich)'; };
function rhCount(rounds, tag){
  let up = 0, eq = 0, dn = 0;
  (rounds || []).forEach(r => { const l = r.lineup && r.lineup[tag]; if(!l || !l.th) return;
    l.att.forEach(x => { if(!x[2]) return; x[2] > l.th ? up++ : x[2] < l.th ? dn++ : eq++; }); });
  const parts = [up ? `<span class="sieg">${up} höher</span>` : '', eq ? `${eq} gleich` : '', dn ? `<span class="niederlage">${dn} tiefer</span>` : ''].filter(Boolean);
  return parts.length ? parts.join(' · ') : '–';
}

// ---------- Aussetz-Empfehlung ----------
// Regeln (Sven, 07.11.): Erst Gesperrte/Freiwillige, dann Pflicht (≤ pflichtBis Sterne am aktuellen Tag),
// dann wer seltener ausgesetzt hat, dann wer mehr Sterne auf der eigenen Basis kassiert hat, dann wessen Aussetzen am längsten her ist.
const W = {
  pflichtBis: 2,      // Pflicht-Aussetzer: Angriff am aktuellen Tag mit so vielen Sternen oder weniger (oder vergessen)
};
// Clans, in denen nur gerecht gewechselt wird, ohne Leistung (Sven, 07.11.: Ü40 Pur 2).
const FAIR_ONLY = ['#2PPGPGRL9'];
// Offene Angriffe am laufenden Liga-/Kriegstag (Angriffe werden live übernommen).
const openToday = (rounds, tag) => { const r = (rounds || []).find(x => x.state === 'inWar'); const l = r && r.lineup[tag];
  return l ? Math.max(0, (r.apm || 1) - l.att.length) : 0; };

// Liga: Wer einen Angriff vergisst, ist für den Rest der Woche raus. Nur wer am letzten Tag vergisst,
// setzt am ersten Tag der nächsten Liga aus (beide Clans, Sven 11.11.).
const lastDayBan = rounds => { const fin = (rounds || []).filter(r => r.final && r.day); if(!fin.length) return {};
  const last = fin.reduce((a, r) => r.day > a.day ? r : a); return last.day >= 7 ? cwlBan([last], () => 'am letzten Liga-Tag vergessen, setzt Tag 1 aus') : {}; };
function cwlBan(rounds, label){
  const ban = {};
  rounds.filter(r => r.final).forEach(r => Object.entries(r.lineup).forEach(([tag, l]) => {
    if(l.att.length < (r.apm || 1) && !ban[tag]) ban[tag] = label(r.day);
  }));
  return ban;
}

// fair = true: nur gerechtes Wechseln, Angriff und Verteidigung zählen nicht.
// skip = Anzahl vorangestellter Runden (Vorwoche), die nur für den aktuellen Tag zählen, nicht fürs Aussetz-Konto.
function benchCalc(rounds, roster, teamSize, vol, ban, fair, skip, carry){
  ban = ban || {};
  const target = rounds.find(r => r.state === 'preparation');
  const past = rounds.filter(r => r.state !== 'preparation');
  if(!past.length || !roster.length || !teamSize) return null;
  // Gewertet wird nur der aktuelle Tag/Krieg. Wer dort ausgesetzt hat, spielt als Nächstes.
  const cur = past[past.length - 1];
  const counted = past.slice(skip || 0);
  const unit = cur.day ? 'Tag' : 'Krieg';
  const satLabel = i => counted[i].day ? 'Tag ' + counted[i].day : (counted.length - i === 1 ? 'im letzten Krieg' : 'vor ' + (counted.length - i) + ' Kriegen');
  const rows = roster.map(p => {
    let played = 0, sat = 0, lastSat = -1;
    counted.forEach((r,i) => { if(r.lineup[p.tag]) played++; else { sat++; lastSat = i; } });
    const l = cur.lineup[p.tag], apm = cur.apm || 1;
    let pflicht = '', group, why = [], down = 0;
    const satWhy = sat ? 'zuletzt ausgesetzt ' + satLabel(lastSat) : 'noch nie ausgesetzt';
    if(ban[p.tag]){ group = -1; pflicht = ban[p.tag]; why.push({t: ban[p.tag], bad: true}); }
    else if(!l){ group = 3; why.push({t: 'hat am aktuellen ' + unit + ' ausgesetzt, spielt als Nächstes'}); }
    else if(fair){ group = 1; why.push({t: satWhy}); }
    else {
      // Neue Liga: Ein vergessener Angriff der Vorwoche zählt nicht mehr, die Sperre in der Woche reicht (Sven, 11.11.).
      const missed = cur.final && !carry ? Math.max(0, apm - l.att.length) : 0;
      if(missed){ why.push({t: 'Angriff vergessen', bad: true}); pflicht = 'Angriff vergessen'; }
      const weak = l.att.filter(x => x[0] <= W.pflichtBis);
      // Schwacher Angriff auf ein kleineres Rathaus wiegt schwerer (Sven, 07.11., nur Ü40 Pur)
      down = l.th ? weak.filter(x => x[2] && x[2] < l.th).length : 0;
      if(weak.length && !pflicht) pflicht = 'nur ' + Math.min(...weak.map(x => x[0])) + '★' + (down ? ' auf kleineres Rathaus' : '');
      if(l.att.length) why.push({t: 'Angriff ' + l.att.map(x => x[0] + '★ ' + x[1] + ' %' + (x[2] ? ' auf RH' + x[2] + rhDiff(l.th, x[2]) : '')).join(', '), bad: !!weak.length});
      else if(!missed) why.push({t: 'greift noch an'});
      if(l.def) why.push({t: 'Verteidigung ' + l.def[0] + '★ ' + l.def[1] + ' %'});
      if(!pflicht) why.push({t: satWhy});
      group = missed ? -1 : pflicht ? 0 : 1;   // Vergesser ganz vorn (Sven, 07.11.)
    }
    const att = l && l.att.length ? l.att : null, def = l && l.def ? l.def : null;
    return {tag: p.tag, name: p.name, played, sat, lastSat, pflicht, group, down, open: openToday(rounds, p.tag), why,
            lastAtt: att, lastDef: def, lastSatTxt: sat ? satLabel(lastSat) : 'nie',
            attS: att ? att.reduce((a,x)=>a+x[0],0) : 9, attP: att ? att.reduce((a,x)=>a+x[1],0) : 999,
            defS: !fair && def ? def[0] : 0, defP: !fair && def ? def[1] : 0,
            inTarget: target ? !!target.lineup[p.tag] : null};
  });
  // Pflicht unter sich: zuerst schwache Angriffe auf ein kleineres Rathaus, dann schwächster Angriff.
  // Sonst: seltener ausgesetzt, mehr kassiert, Aussetzen länger her.
  rows.sort((a,b) => a.group - b.group
    || (a.group === 0 ? b.down - a.down || a.attS - b.attS || a.attP - b.attP : 0)
    || a.sat - b.sat || b.defS - a.defS || b.defP - a.defP || a.lastSat - b.lastSat
    || a.name.localeCompare(b.name, 'de'));
  const bench = Math.max(0, roster.length - teamSize);
  // Freiwillige setzen zuerst aus, die übrigen Plätze gehen der Reihe nach. Wer am aktuellen Tag ausgesetzt hat, bleibt drin.
  vol = (vol || []).filter(t => rows.some(r => r.tag === t));
  const banned = rows.filter(r => r.group === -1 && !vol.includes(r.tag)).length;
  const need = Math.max(0, bench - vol.length - banned);
  let k = 0;
  rows.forEach((r,i) => {
    r.vol = vol.includes(r.tag);
    r.sit = r.vol || r.group === -1 || (r.group >= 0 && r.group < 3 && k++ < need);
    r.freed = !r.sit && i < bench && r.group < 3;   // wäre ohne Freiwillige dran gewesen
  });
  return {rows, bench, teamSize, total: roster.length, target, fair: !!fair, nextNo: (target ? target.day : past.length + 1)};
}

function benchCard(title, calc, unit, opt){
  if(!calc) return `<div class="card"><h2>${title}</h2><span class="muted">Noch zu wenig Daten. Die Empfehlung erscheint, sobald der erste ${unit} gelaufen ist.</span></div>`;
  // Anzeige: Vergesser/Gesperrte, dann Freiwillige, dann der Rest (Sven, 07.11.)
  const sit = [...calc.rows.filter(r => r.sit && !r.vol && r.group === -1), ...calc.rows.filter(r => r.sit && r.vol), ...calc.rows.filter(r => r.sit && !r.vol && r.group !== -1)];
  const over = sit.length - calc.bench;
  const freed = calc.rows.filter(r => r.freed);
  const fertig = !!(opt && doneOf(opt) && calc.target);
  const clash = calc.target && !fertig ? sit.filter(r => r.inTarget) : [];
  const actual = fertig ? [...calc.rows.filter(r => r.inTarget === false && r.vol), ...calc.rows.filter(r => r.inTarget === false && !r.vol)] : [];
  const whyHtml = r => r.why.map(w => `<span class="${w.bad ? 'err' : 'muted'}"${w.bad ? ' style="font-weight:600"' : ''}>${esc(w.t)}</span>`).join('<span class="muted"> · </span>');
  const volTag = r => r.rot ? ' <span class="pill">freiwillig / Ampel</span> ' + ampelHtml('out') : r.vol ? ' <span class="pill">freiwillig</span>' : '';
  const left = r => `<span><b>${esc(r.name)}</b>${volTag(r)}${r.open ? ' <span class="openbadge">noch nicht angegriffen</span>' : ''}<br><span style="font-size:14px">${whyHtml(r)}</span></span>`;
  const satTxt = r => `<span class="muted" style="font-size:12px">${r.sat ? r.sat + '× ausgesetzt' : 'nie ausgesetzt'}</span>`;
  const right = (r, status) => `<span class="benchright"><span>${status}</span>${satTxt(r)}</span>`;
  const list = fertig
    ? (actual.length ? `<ul class="list">${actual.map(r => `<li>${left(r)}${right(Object.assign({}, r, {group: 9}), '<span class="pill ok">setzt aus</span>')}</li>`).join('')}</ul>`
                     : '<p>Niemand setzt aus.</p>')
    : calc.bench === 0
    ? '<p>Alle können spielen, es muss niemand aussetzen.</p>'
    : `<ul class="list">${sit.map(r => `<li>${left(r)}${right(r, r.inTarget===true?'<span class="pill bad">noch aufgestellt</span>':r.inTarget===false?'<span class="pill ok">umgesetzt</span>':'')}</li>`).join('')}</ul>`;
  const table = calc.rows.map((r,i) => `<tr class="${r.sit?'openrow':''}">
    <td>${i+1}. <span class="name">${esc(r.name)}</span>${r.open ? ` <span class="openbadge">${r.open} offen</span>` : ''}${volTag(r)}${r.pflicht ? ` <span class="pill bad">Pflicht</span>` : ''}</td>
    <td>${r.lastAtt ? r.lastAtt.map(x => x[0]+'★ '+x[1]+' %').join(', ') : '–'}</td>
    <td>${r.lastDef ? r.lastDef[0]+'★ '+r.lastDef[1]+' %' : '–'}</td>
    <td>${r.played}</td><td>${r.sat ? `<span class="pill ok">${r.sat}×</span>` : 'nein'}</td><td>${esc(r.lastSatTxt)}</td>
    ${calc.target ? `<td>${r.inTarget ? 'ja' : 'nein'}</td>` : ''}</tr>`).join('');
  return `<div class="card"><h2>${title}</h2>
    ${opt ? doneBanner(opt) : ''}
    ${calc.target && unit === 'Tag' ? syncHint(calc.target) : ''}
    <p class="muted" style="margin-top:-4px">${calc.total} Teilnehmer, ${fertig ? calc.total - actual.length : calc.teamSize} spielen: <b>${fertig ? actual.length : calc.bench} ${fertig ? (actual.length === 1 ? 'setzt' : 'setzen') + ' aus (Stand im Spiel)' : 'setzen aus'}</b></p>
    ${calc.prevNote ? `<p class="muted" style="font-size:14px">${calc.prevNote}</p>` : ''}
    ${list}
    ${over > 0 && !fertig ? `<p class="err" style="font-size:14px">Es müssten ${sit.length} aussetzen, frei sind aber nur ${calc.bench} Plätze. Die Führung muss entscheiden, wer trotzdem spielt.</p>` : ''}
    ${freed.length && !fertig ? `<p class="muted" style="font-size:14px">Darf spielen, weil jemand freiwillig aussetzt: ${freed.map(r => '<b>' + esc(r.name) + '</b>').join(', ')}</p>` : ''}
    ${calc.target && calc.bench && !clash.length && !fertig ? `<p class="sieg" style="font-size:14px;font-weight:600">Alle Empfehlungen für ${unit} ${calc.nextNo} sind umgesetzt.</p>` : ''}
    ${clash.length ? `<p class="err" style="font-size:14px">${clash.length} der Empfohlenen ${clash.length===1?'ist':'sind'} im Spiel schon für ${unit} ${calc.nextNo} aufgestellt.</p>` : ''}
    <details style="margin-top:8px"><summary>Alle Spieler in Reihenfolge anzeigen</summary>
    <div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>Spieler</th><th>Angriff aktueller ${unit}</th><th>Verteidigung aktueller ${unit}</th><th>Gespielt</th><th>Ausgesetzt</th><th>Zuletzt ausgesetzt</th>${calc.target?'<th>Aufgestellt</th>':''}</tr></thead><tbody>${table}</tbody></table></div></details>
    ${opt ? benchActions(opt, calc.rows) : ''}
    ${calc.rows.some(r => r.pflicht && !r.sit) ? `<p class="muted" style="font-size:14px">Pflicht, aber kein Aussetz-Platz mehr frei, spielt deshalb: ${calc.rows.filter(r => r.pflicht && !r.sit).map(r => '<b>' + esc(r.name) + '</b>').join(', ')}</p>` : ''}
    <p class="legend">${unit === 'Tag' ? 'Liga: Wer einen Angriff vergisst, ist für den Rest der Woche raus. Wer am letzten Liga-Tag vergisst, setzt am ersten Tag der nächsten Liga aus. Am ersten Liga-Tag zählt der letzte Tag der Vorwoche. ' : ''}${calc.fair
      ? `Hier wird nur gerecht gewechselt, Angriff und Verteidigung zählen nicht. Reihenfolge: ${unit === 'Tag' ? 'zuerst Gesperrte (Angriff vergessen), dann Freiwillige' : 'zuerst Freiwillige'}, dann wer seltener ausgesetzt hat, bei Gleichstand wessen Aussetzen am längsten her ist. Wer am aktuellen ${unit} ausgesetzt hat, spielt als Nächstes.`
      : `Reihenfolge: zuerst wer einen Angriff vergessen hat, dann Freiwillige, dann Pflicht-Aussetzer (Angriff am aktuellen ${unit} mit ${W.pflichtBis} Sternen oder weniger, gilt auch, wenn jemand schon ausgesetzt hat; zuerst wer ein kleineres Rathaus angegriffen hat, dann wer weniger Sterne, dann wer weniger Prozent geholt hat), dann wer seltener ausgesetzt hat. Bei Gleichstand setzt aus, wer am aktuellen ${unit} mehr Sterne auf der eigenen Basis kassiert hat (stärkste gegnerische Attacke), danach wessen Aussetzen am längsten her ist. Wer noch nicht angegriffen hat, wird genauso einsortiert. Wer am aktuellen ${unit} ausgesetzt hat, spielt als Nächstes.`}
    Die Empfehlung ist ein Vorschlag, die Entscheidung trifft die Führung.</p></div>`;
}

function cwlView(){
  const clans = S.clan==='alle' ? S.data.clans : [S.data.clans[S.clan]];
  return clans.map(c => {
    const s = c.cwl;
    if(!s) return `<div class="card"><h2>Clankriegsliga ${esc(c.name)}</h2><span class="muted">Noch keine Ligasaison erfasst. Die Liga läuft jeweils in der ersten Woche des Monats.</span></div>`;
    // Ausgesetzt = in der Liga-Teilnehmerliste, aber an einem gelaufenen Tag nicht aufgestellt.
    const pastR = s.rounds.filter(r => r.state !== 'preparation');
    const inRoster = new Set((s.roster || []).map(m => m.tag));
    const satN = tag => inRoster.has(tag) ? pastR.filter(r => !r.lineup[tag]).length : null;
    const all = [...s.players, ...(s.roster || []).filter(m => !s.players.some(p => p.tag === m.tag))
      .map(m => ({tag: m.tag, name: m.name, th: m.th, attacks: 0, stars: 0, pct: 0, triples: 0, missed: 0, defs: 0, defStars: 0}))];
    const rows = all.map((p,i) => { const n = satN(p.tag), o = openToday(s.rounds, p.tag); return `<tr class="${o ? 'openrow' : ''}" ${o ? `title="${o} Angriff(e) heute offen"` : ''}>
      <td>${i+1}. <span class="name">${esc(p.name)}</span> <span class="role">RH${p.th??'?'}</span></td>
      <td>${ampelHtml(warPrefOf(p.tag))}</td>
      <td>${n == null ? '–' : n ? `<span class="pill ok big">ja, ${n}×</span>` : '<span class="pill big">nein</span>'}</td>
      <td style="text-align:center;white-space:nowrap">${p.attacks}${o ? ` <span class="openbadge">${o} offen</span>` : ''}</td><td><b>${p.stars}</b></td>
      <td>${p.attacks?(p.stars/p.attacks).toFixed(2):'–'}</td>
      <td>${p.attacks?(p.pct/p.attacks).toFixed(0)+' %':'–'}</td>
      <td style="white-space:nowrap">${rhCount(s.rounds, p.tag)}</td>
      <td>${p.missed?`<span class="niederlage">${p.missed}</span>`:'0'}</td>
      <td>${p.defs?(p.defStars/p.defs).toFixed(2):'–'}</td></tr>`; }).join('');
    const teamSize = (s.rounds[s.rounds.length-1] || {}).teamSize;
    const prep = s.rounds.find(r => r.state === 'preparation');
    const nextDay = prep ? prep.day : s.rounds.filter(r => r.state !== 'preparation').length + 1;
    const volKey = 'liga:' + s.season + ':' + nextDay;
    // Ampel rot im Spiel = freiwillig (Sven, 07.11.), zusätzlich zu den von der Führung Eingetragenen
    const rot = (s.roster || []).filter(m => warPrefOf(m.tag) === 'out').map(m => m.tag);
    const vol = [...new Set([...(((S.fd[c.tag] || {}).freiwillig || {})[volKey] || []), ...rot])];
    // Erster Liga-Tag: Grundlage ist die Vorwoche (Vergessene gesperrt, sonst zählt deren letzter Tag).
    const pv = c.cwlPrev, firstDay = !s.rounds.some(r => r.state !== 'preparation') && pv && pv.rounds.length;
    const ban = firstDay ? lastDayBan(pv.rounds) : cwlBan(s.rounds, d => 'Tag ' + d + ' vergessen, raus bis Wochenende');
    const calcRounds = firstDay ? [...pv.rounds.filter(r => r.state !== 'preparation'), ...s.rounds] : s.rounds;
    // Ab Tag 7 (und nach Wochenende bis zur neuen Liga): Vorschau auf Tag 1 der nächsten Liga, gerechnet wie dort (Sven, 11.11.)
    const played = s.rounds.filter(r => r.state !== 'preparation').length;
    const preview = !prep && played >= 7;
    const calc = preview
      ? benchCalc(s.rounds, s.roster || [], teamSize, rot, lastDayBan(s.rounds), FAIR_ONLY.includes(c.tag), played, true)
      : benchCalc(calcRounds, s.roster || [], teamSize, vol, ban, FAIR_ONLY.includes(c.tag),
          firstDay ? pv.rounds.filter(r => r.state !== 'preparation').length : 0, !!firstDay);
    if(calc) calc.rows.forEach(r => { r.rot = rot.includes(r.tag); });
    if(calc && firstDay) calc.prevNote = 'Erster Liga-Tag: Gewertet wird der letzte Tag der Vorwoche. Wer dort einen Angriff vergessen hat, setzt aus. Vergessene Angriffe an früheren Tagen zählen nicht mehr.';
    if(calc && preview){ calc.nextNo = 1;
      calc.prevNote = 'Vorschau: Gewertet wird Tag 7. Wer an Tag 7 einen Angriff vergessen hat, setzt an Tag 1 aus. Vergessene Angriffe an Tag 1 bis 6 zählen in der neuen Liga nicht mehr. Teamgröße und Teilnehmer der nächsten Liga stehen noch nicht fest, gerechnet wird mit den aktuellen. Freiwillige Aussetzer trägst du ein, sobald die neue Liga läuft.'; }
    const rec = !s.roster ? ''
      : preview ? benchCard(`Aussetz-Empfehlung ${esc(c.name)} für Tag 1 der nächsten Liga (Vorschau)`, calc, 'Tag', null)
      : benchCard(`Aussetz-Empfehlung ${esc(c.name)} für Liga-Tag ${calc ? calc.nextNo : ''}`, calc, 'Tag', {clan: c.tag, key: volKey, label: 'Liga-Tag ' + nextDay});
    return rec + `
      <div class="card"><h2>Rangliste Liga ${esc(c.name)}</h2>
      <div class="table-wrap"><table><thead><tr><th>Spieler</th><th>Ampel</th><th>Ausgesetzt</th><th style="text-align:center">Angriffe</th><th>Sterne</th><th>Ø Sterne</th><th>Ø Zerstörung</th><th>Gegner-RH</th><th>Verpasst</th><th>Ø kassiert</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="legend">Gegner-RH = wie oft ein höheres, gleiches oder tieferes Rathaus als das eigene angegriffen wurde. Orange hinterlegt = heute noch Angriff offen. Ampel = Kriegsbereitschaft, die der Spieler im Spiel selbst stellt, rot gilt in der Aussetz-Empfehlung als freiwillig. Ausgesetzt = als Liga-Teilnehmer gemeldet, aber an einem gelaufenen Tag nicht aufgestellt. Verpasst = aufgestellt, aber nicht angegriffen (nur abgeschlossene Tage). Ø kassiert = Sterne, die der Gegner im Schnitt auf dieser Basis geholt hat.</p></div>`;
  }).join('');
}

// ---------- Angaben der Führung speichern (Bonus, freiwillige Aussetzer) ----------
const SAVE_URL = 'https://clan-board-live.vercel.app/api/speichern';
const fdClan = tag => (S.fd[tag] = S.fd[tag] || {});

function applyBonus(tag, d){
  const B = fdClan(tag);
  B[d.season] = {anzahl: d.anzahl, verzicht: d.verzicht, bonus: d.bonus};
  if(d.leistung != null) B[d.season].leistung = d.leistung;
  B[d.prev] = Object.assign({anzahl: null, verzicht: []}, B[d.prev], {bonus: d.prevBonus});
}
function applyDone(tag, key, v){ const B = fdClan(tag); B.erledigt = Object.assign({}, B.erledigt); if(v) B.erledigt[key] = v; else delete B.erledigt[key]; }
function applyVol(tag, key, tags){ const B = fdClan(tag); B.freiwillig = Object.assign({}, B.freiwillig, {[key]: tags}); }

function pinForget(form){
  let saved = ''; try{ saved = localStorage.getItem('clanboard-pin') || ''; }catch(e){}
  return saved ? btn('forgetpin', form, 'PIN vergessen') : '';
}

const PIN_LEN = 6;
const pinCount = v => { const n = (v || '').length; return n >= PIN_LEN ? '<span class="sieg">✓ 6 von 6 Ziffern</span>' : n + ' von ' + PIN_LEN + ' Ziffern'; };

function pinField(form){
  let saved = ''; try{ saved = localStorage.getItem('clanboard-pin') || ''; }catch(e){}
  return saved ? `<div class="pinbox ok"><b>PIN ist auf diesem Gerät gespeichert</b> <span class="muted">Einfach speichern.</span></div>`
    : `<label class="pinbox"><b>PIN der Führung (6 Ziffern)</b><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="${PIN_LEN}" data-pin="${esc(form)}" value="${esc(S.pin[form] || '')}" autocomplete="current-password"><span class="pincount" data-pincount="${esc(form)}">${pinCount(S.pin[form])}</span><span class="muted" style="font-size:14px;flex-basis:100%">Nur einmal nötig, danach merkt sich das Gerät die PIN.</span></label>`;
}

// Schickt die Angaben ab. apply() trägt sie bei Erfolg sofort lokal ein.
async function postFd(form, body, apply){
  let pin = (S.pin[form] || '').trim();
  if(!pin){ try{ pin = localStorage.getItem('clanboard-pin') || ''; }catch(e){} }
  if(!pin){ S.msg[form] = {err: true, text: 'Bitte PIN eingeben.'}; return render(); }
  if(!/^\d{6}$/.test(pin)){ S.msg[form] = {err: true, text: 'Die PIN hat genau 6 Ziffern, eingegeben sind ' + pin.length + '.'}; return render(); }
  S.msg[form] = {text: 'Speichere …'}; render();
  try{
    const r = await fetch(SAVE_URL, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                     body: JSON.stringify(Object.assign({pin}, body))});
    const j = await r.json().catch(() => ({}));
    if(r.status === 403){ try{ localStorage.removeItem('clanboard-pin'); }catch(e){} }
    if(!r.ok) throw new Error(j.error || ('Fehler ' + r.status));
    try{ localStorage.setItem('clanboard-pin', pin); }catch(e){}
    delete S.pin[form];
    S.pending.push({at: Date.now(), apply});
    apply();
    delete S.edit[form];
    S.msg[form] = {text: 'Gespeichert. Für alle anderen sichtbar in etwa 2 Minuten.'};
  }catch(e){
    S.msg[form] = {err: true, text: 'Nicht gespeichert: ' + e.message};
  }
  render();
}

const msgHtml = form => { const m = S.msg[form]; return m ? `<p class="${m.err ? 'err' : 'sieg'}" style="font-size:14px;font-weight:600">${esc(m.text)}</p>` : ''; };
const btn = (act, form, label, cls) => `<button class="reload act ${cls || ''}" data-act="${act}" data-form="${esc(form)}">${label}</button>`;

function fdEvents(app){
  app.onclick = e => {
    const b = e.target.closest('[data-act]'); if(!b) return;
    const form = b.dataset.form, act = b.dataset.act;
    if(act === 'edit'){ S.edit[form] = S.forms[form](); delete S.msg[form]; render(); }
    else if(act === 'cancel'){ delete S.edit[form]; delete S.msg[form]; render(); }
    else if(act === 'save') S.saves[form]();
    else if(act === 'forgetpin'){ try{ localStorage.removeItem('clanboard-pin'); }catch(e){} render(); }
  };
  app.oninput = e => { const p = e.target.closest('[data-pin]'); if(!p) return;
    p.value = p.value.replace(/\D/g, '').slice(0, PIN_LEN); S.pin[p.dataset.pin] = p.value;
    const c = document.querySelector(`[data-pincount="${CSS.escape(p.dataset.pin)}"]`); if(c) c.innerHTML = pinCount(p.value); };
  app.onkeydown = e => { const p = e.target.closest('[data-pin]'); if(p && e.key === 'Enter'){ e.preventDefault(); S.saves[p.dataset.pin](); } };
  app.onchange = e => {
    const el = e.target.closest('[data-f]'); if(!el) return;
    const d = S.edit[el.dataset.form]; if(!d) return;
    const f = el.dataset.f;
    if(f === 'by'){ d.by = el.value; return; }
    if(f === 'leistung'){ const v = parseInt(el.value, 10); d.leistung = Number.isInteger(v) && v >= 0 && v <= 50 ? v : WB.leistung; return render(); }
    if(f === 'anzahl'){ const v = parseInt(el.value, 10); d.anzahl = Number.isInteger(v) && v >= 0 && v <= 50 ? v : null; return render(); }
    const t = el.dataset.t;
    d[f] = el.checked ? [...new Set([...d[f], t])] : d[f].filter(x => x !== t);
    render();
  };
}

// ---------- Bonus-Empfehlung ----------
// Bewertet die ganze Ligawoche. Gewichte hier anpassen, wenn die Führung es anders will.
const WB = {
  stern: 10,          // je Stern in der Woche
  prozent: 0.1,       // je Prozentpunkt Zerstörung in der Woche
  gehalten: 3,        // je Stern, den der Gegner auf der eigenen Basis NICHT geholt hat
  letzterBonus: 0.5,  // Faktor, wenn es letzte Saison schon einen Bonus gab
  vorschlaege: 10,    // so viele Spieler vorschlagen (mehr als Boni, falls jemand nicht will)
  rhStufe: 0.05,      // je Rathaus-Stufe Unterschied: Angriffspunkte +5 % nach oben, -5 % nach unten (Sven, 11.11.)
  rhMax: 3,           // höchstens so viele Stufen werden gewertet
  leistung: 2,        // Ü40 Pur 2: Standard für "davon für Leistung" (Kerstin, 11.11.)
  monate: 6,          // Ü40 Pur 2: so viele Monate zurück wertet die Rotation (eingetragen wird nur der Vormonat, die Historie wächst mit)
};
// Ü40 Pur 2 (FAIR_ONLY): 1-2 Boni nach Leistung, der Rest reihum an wer am längsten keinen hatte.
const prevSeasonOf = s => { let [y,m] = s.split('-').map(Number); m--; if(!m){ m = 12; y--; } return y + '-' + String(m).padStart(2,'0'); };
const monthDE = s => { const [y,m] = s.split('-'); return new Date(+y, +m-1, 1).toLocaleDateString('de-DE',{month:'long'}); };

// Vormonate, die die Rotation in Ü40 Pur 2 wertet (aus den gespeicherten Boni).
const bonusMonths = c => { const out = []; let m = c.cwl.season;
  for(let i = 0; i < WB.monate; i++){ m = prevSeasonOf(m); out.push(m); } return out; };

function bonusInfo(c){
  const s = c.cwl, B = S.fd[c.tag] || {};
  const prev = prevSeasonOf(s.season), cur = B[s.season] || {}, pb = B[prev] || {};
  const info = {season: s.season, prev, anzahl: cur.anzahl ?? null, leistung: cur.leistung ?? WB.leistung,
          verzicht: [...(cur.verzicht || [])], bonus: [...(cur.bonus || [])], prevBonus: [...(pb.bonus || [])]};
  bonusMonths(c).forEach(m => { info['h:' + m] = [...((B[m] || {}).bonus || [])]; });
  return info;
}

function bonusCalc(c, info){
  const s = c.cwl, fair = FAIR_ONLY.includes(c.tag);
  const byTag = {}; s.players.forEach(p => byTag[p.tag] = p);
  const roster = s.roster && s.roster.length ? s.roster : s.players;
  const rows = roster.map(m => {
    const p = byTag[m.tag] || {attacks:0, stars:0, pct:0, missed:0, defs:0, defStars:0};
    const held = 3 * p.defs - p.defStars, why = [];
    let out = null;
    if(info.verzicht.includes(m.tag)) out = 'verzichtet diese Saison';
    else if(p.missed) out = p.missed + '× Angriff vergessen';
    else if(!p.attacks) out = 'noch kein Angriff';
    // Angriffe einzeln werten, damit der Rathaus-Unterschied je Angriff zählt (beide Clans).
    let attPts = 0, rhAdj = 0, up = 0, dn = 0, eq = 0;
    s.rounds.forEach(r => { const l = r.lineup && r.lineup[m.tag]; if(!l) return;
      l.att.forEach(x => { const base = x[0] * WB.stern + x[1] * WB.prozent;
        const d = l.th && x[2] ? Math.max(-WB.rhMax, Math.min(WB.rhMax, x[2] - l.th)) : 0;
        if(l.th && x[2]){ x[2] > l.th ? up++ : x[2] < l.th ? dn++ : eq++; }
        attPts += base * (1 + d * WB.rhStufe); rhAdj += base * d * WB.rhStufe; }); });
    if(!attPts && p.stars) attPts = p.stars * WB.stern + p.pct * WB.prozent;
    let score = attPts + held * WB.gehalten;
    if(p.attacks) why.push(p.stars + '★ aus ' + p.attacks + (p.attacks === 1 ? ' Angriff' : ' Angriffen') + ' · Ø ' + (p.pct / p.attacks).toFixed(0) + ' %');
    if(Math.round(rhAdj)) why.push('RH ' + (rhAdj > 0 ? '+' : '−') + Math.abs(Math.round(rhAdj)) + ' Pkt.');
    if(p.defs) why.push('Vert. ' + held + '/' + 3 * p.defs + ' gehalten');
    let ago = Infinity, lastTxt = '–';
    if(fair){
      const months = bonusMonths(c), i = months.findIndex(mm => (mm === info.prev ? info.prevBonus : info['h:' + mm] || []).includes(m.tag));
      if(i >= 0){ ago = i + 1; lastTxt = monthDE(months[i]); }
      why.push(i >= 0 ? 'letzter Bonus ' + monthDE(months[i]) : 'kein Bonus eingetragen');
    } else if(info.prevBonus.includes(m.tag)){ score *= WB.letzterBonus; why.push('Bonus im ' + monthDE(info.prev) + ', halbiert'); lastTxt = monthDE(info.prev) + ' (halbiert)'; }
    return {tag: m.tag, name: m.name || p.name, score, ago, out, lastTxt, stars: p.stars, attacks: p.attacks, up, dn, eq, why: why.join(' · '), got: info.bonus.includes(m.tag)};
  });
  let ok = rows.filter(r => !r.out).sort((a,b) => b.score - a.score);
  if(fair){
    // Die besten k nach Leistung, danach reihum: wer am längsten keinen Bonus hatte, bei Gleichstand Leistung.
    const k = Math.min(info.leistung ?? WB.leistung, info.anzahl ?? Infinity);
    const top = ok.slice(0, k); top.forEach(r => r.kind = 'Leistung');
    const rest = ok.slice(k).sort((a,b) => (b.ago - a.ago) || (b.score - a.score)); rest.forEach(r => r.kind = 'Reihe');
    ok = [...top, ...rest];
  }
  return {roster, ok, outs: rows.filter(r => r.out).sort((a,b) => b.score - a.score)};
}

function bonusCard(c){
  if(!c.cwl || !c.cwl.players.length) return '';
  const s = c.cwl, form = 'bonus' + c.tag, fair = FAIR_ONLY.includes(c.tag);
  S.forms[form] = () => bonusInfo(c);
  S.saves[form] = () => { const d = S.edit[form];
    postFd(form, {type: 'bonus', clan: c.tag, season: d.season, anzahl: d.anzahl, leistung: fair ? d.leistung : null,
                  verzicht: d.verzicht, bonus: d.bonus, prevSeason: d.prev, prevBonus: d.prevBonus},
           () => applyBonus(c.tag, d)); };
  const edit = S.edit[form], info = edit || bonusInfo(c), {ok, outs, roster} = bonusCalc(c, info);
  const done = s.rounds.length >= 7 && s.rounds.every(r => r.final);
  const running = s.rounds.find(r => r.state === 'inWar');
  const stand = done ? 'Ligawoche beendet.' : 'Zwischenstand' + (running ? ', Tag ' + running.day + ' läuft.' : ' nach ' + s.rounds.filter(r => r.final).length + ' von 7 Tagen.');
  const n = info.anzahl;
  // Sind alle Boni verteilt, zählt nur noch, wer tatsächlich einen bekommen hat (auch außerhalb der Vorschläge).
  const verteilt = n != null && n > 0 && info.bonus.length >= n;
  const top = ok.slice(0, Math.max(WB.vorschlaege, n ?? 0));
  const show = verteilt ? [...top, ...ok.slice(top.length).filter(r => r.got)] : top;
  const mark = (r,i) => r.got ? '<span class="pill ok">erhalten</span>'
    : n == null || verteilt ? '' : i < n ? '<span class="pill">Bonus</span>' : '<span class="pill">Reserve</span>';
  // Kompakte Tabelle (Sven, 11.11.): eine Zeile pro Spieler, Begründung als Spalten
  const rhTxt = r => [r.up ? `<span class="sieg">${r.up} höher</span>` : '', r.dn ? `<span class="niederlage">${r.dn} tiefer</span>` : ''].filter(Boolean).join(' · ') || (r.eq ? 'gleich' : '–');
  const list = show.length
    ? `<div class="table-wrap"><table class="bonustab"><thead><tr><th>#</th><th class="l">Spieler</th>${fair ? '<th>Art</th>' : ''}<th title="Sterne aus Angriffen">★</th><th title="Wie oft ein höheres oder tieferes Rathaus als das eigene angegriffen wurde">Gegner-RH</th><th>Pkt.</th><th>Letzter Bonus</th><th></th></tr></thead><tbody>
      ${show.map((r,i) => `<tr><td>${i+1}</td><td class="l"><span class="name">${esc(r.name)}</span></td>${fair ? `<td>${r.kind === 'Leistung' ? 'Leistung' : 'reihum'}</td>` : ''}
        <td>${r.stars}<span class="muted">/${r.attacks}</span></td><td>${rhTxt(r)}</td><td><b>${Math.round(r.score)}</b></td><td>${esc(r.lastTxt)}</td><td>${mark(r,i)}</td></tr>`).join('')}
      </tbody></table></div>`
    : '<p class="muted">Noch niemand mit Angriff in dieser Woche.</p>';
  const outList = outs.length
    ? `<details style="margin-top:8px"><summary>Nicht berücksichtigt (${outs.length})</summary><ul class="list">${outs.map(r => `<li><span><b>${esc(r.name)}</b></span><span class="muted">${esc(r.out)}</span></li>`).join('')}</ul></details>` : '';
  const head = `<p class="muted" style="margin-top:-4px">${stand} ` + (n == null
    ? (fair ? `${Math.min(WB.vorschlaege, ok.length)} Vorschläge. Anzahl der Boni noch nicht eingetragen.</p>` : `Die besten ${WB.vorschlaege}. Anzahl der Boni noch nicht eingetragen.</p>`)
    : fair ? `<b>${n} Boni</b>, davon ${Math.min(info.leistung ?? WB.leistung, n)} für Leistung, der Rest reihum.</p>`
    : `<b>${n} Boni</b>, die besten ${Math.max(WB.vorschlaege, n)} vorgeschlagen.</p>`);
  const given = info.bonus.length, allGiven = n != null && n > 0 && given >= n;
  let body = `<p style="margin-top:10px">${allGiven ? btn('edit', form, 'Boni verteilt (' + given + ' von ' + n + ')', 'okbtn')
    : btn('edit', form, 'Bonus-Angaben bearbeiten' + (n ? ' (' + given + ' von ' + n + ' verteilt)' : ''))}</p>`;
  if(edit){
    const cb = (f, tag) => `<input type="checkbox" data-f="${f}" data-form="${esc(form)}" data-t="${esc(tag)}" ${info[f].includes(tag) ? 'checked' : ''}>`;
    body = `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
      <p><label>Anzahl Boni (steht im Spiel beim Verteilen): <input type="number" min="0" max="50" style="width:70px" data-f="anzahl" data-form="${esc(form)}" value="${n ?? ''}"></label></p>
      ${fair ? `<p><label>Davon für Leistung: <input type="number" min="0" max="50" style="width:70px" data-f="leistung" data-form="${esc(form)}" value="${info.leistung ?? WB.leistung}"></label></p>
` : ''}
      <div class="table-wrap"><table><thead><tr><th>Spieler</th><th>Will keinen Bonus</th><th>Bonus ${monthDE(info.season)}</th><th>Bonus ${monthDE(info.prev)}</th></tr></thead><tbody class="fdedit">
      ${[...roster].sort((a,b) => a.name.localeCompare(b.name, 'de')).map(m => `<tr><td><span class="name">${esc(m.name)}</span></td><td>${cb('verzicht', m.tag)}</td><td>${cb('bonus', m.tag)}</td><td>${cb('prevBonus', m.tag)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="saverow">${pinField(form)}${btn('save', form, 'Speichern')} ${btn('cancel', form, 'Abbrechen')}${pinForget(form)}</p></div>`;
  }
  return `<div class="card"><h2>Bonus-Empfehlung ${esc(c.name)} (Liga ${monthDE(s.season)})</h2>
    ${head}${list}${outList}${msgHtml(form)}${body}
    <p class="legend">Bewertet wird die ganze Ligawoche: je Stern ${WB.stern}, je Prozent Zerstörung ${WB.prozent}, je gehaltenem Stern auf der eigenen Basis ${WB.gehalten}. Angriffe auf ein höheres Rathaus bringen je Stufe ${WB.rhStufe * 100} % mehr, auf ein tieferes ${WB.rhStufe * 100} % weniger (höchstens ${WB.rhMax} Stufen), Spalte „Gegner-RH“. „★“ = Sterne/Angriffe. ${fair ? `Die besten nach Punkten bekommen die Leistungsboni (Feld „Davon für Leistung“). Die übrigen gehen reihum: zuerst wer am längsten keinen Bonus hatte (geschaut wird bis zu ${WB.monate} Monate zurück, soweit Boni im Board eingetragen sind), bei Gleichstand nach Punkten.` : 'Wer letzte Saison einen Bonus bekam, bekommt die Hälfte der Punkte.'} Wer einen Angriff vergessen hat, keinen Angriff hatte oder verzichtet, fällt raus. Die Empfehlung ist ein Vorschlag, die Entscheidung trifft die Führung.</p></div>`;
}

function gamesList(){
  const rs = rows().filter(r => r.games!=null).sort((a,b)=>b.games-a.games);
  return `<div class="card"><h2>Clanspiele diesen Monat</h2>${rs.length?`<ul class="list">${rs.map((r,i)=>`<li><span>${i+1}. <b>${esc(r.name)}</b>${S.clan==='alle'?' <span class="muted">'+esc(r.clanName)+'</span>':''}</span><span>${fmtN(r.games)} Punkte</span></li>`).join('')}</ul>`
    :'<span class="muted">Die Clanspiele laufen vom 22. bis 28. des Monats. Punkte werden ab dem ersten Abruf im Zeitraum gezählt.</span>'}</div>`;
}

function logText(l){
  const n = `<b>${esc(l.name)}</b>`, rl = r => ROLE[r] || 'Mitglied';
  switch(l.type){
    case 'join': return `<span class="sieg">beigetreten</span> ${n}`;
    case 'leave': return `<span class="niederlage">ausgetreten</span> ${n}`;
    case 'role': return `${n}: ${rl(l.from)} → <b>${rl(l.to)}</b>`;
    case 'name': return `${esc(l.from)} heißt jetzt ${n}`;
    case 'th': return `${n}: Rathaus ${l.from} → <b>${l.to}</b>`;
    case 'warPref': return `${n}: Kriegsbereitschaft ${l.to==='in'?'<span class="sieg">an</span>':'<span class="niederlage">aus</span>'}`;
  }
  return n;
}

// Reiter "Mehr": Clanstadt, Clanspiele, Protokoll einklappbar (für die Führung weniger wichtig)
function moreView(){
  const sec = (k, title, fn) => `<details data-more="${k}" ${(S.more || {})[k] ? 'open' : ''} style="margin:10px 0">
    <summary style="font-weight:700;font-size:19px;padding:12px 4px">${title}</summary>${fn()}</details>`;
  return sec('clanstadt', 'Clanstadt', raidList) + sec('clanspiele', 'Clanspiele', gamesList) + sec('log', 'Protokoll', logList);
}

// Reiter "Bonus": Empfehlung und Verlauf der eingetragenen Boni
function bonusView(){
  const clans = S.clan==='alle' ? S.data.clans : [S.data.clans[S.clan]];
  return clans.map(c => (bonusCard(c) || `<div class="card"><h2>Bonus ${esc(c.name)}</h2><span class="muted">Noch keine Ligasaison erfasst.</span></div>`) + bonusHistory(c)).join('');
}

function bonusHistory(c){
  if(!c.cwl) return '';
  const B = S.fd[c.tag] || {};
  const months = [c.cwl.season, ...bonusMonths(c)].filter(m => (B[m] || {}).bonus && B[m].bonus.length);
  if(!months.length) return `<div class="card"><h2>Bonus-Verlauf ${esc(c.name)}</h2><span class="muted">Noch keine Boni eingetragen. Der Verlauf füllt sich mit jeder Liga, in der die Boni hier eingetragen werden.</span></div>`;
  // Kompakt (Sven, 11.11.): eine Zeile je Monat, Empfänger als Namen
  const name = t => { const m = c.memberList.find(x => x.tag === t); return m ? m.name : nameOf(t); };
  const rowsH = months.map(m => `<li><span><b>${monthDE(m)}</b> <span class="muted">(${B[m].bonus.length})</span><br>${
    B[m].bonus.map(t => `<span class="pill">${esc(name(t))}</span>`).join(' ')}</span></li>`).join('');
  const got = new Set(months.flatMap(m => B[m].bonus));
  const none = c.memberList.filter(m => !got.has(m.tag)).sort((a,b) => a.name.localeCompare(b.name, 'de'));
  return `<div class="card"><h2>Bonus-Verlauf ${esc(c.name)}</h2><ul class="list">${rowsH}</ul>
    ${none.length ? `<details style="margin-top:8px"><summary>Noch kein Bonus seit ${monthDE(months[months.length - 1])} (${none.length})</summary><p style="line-height:2">${none.map(m => `<span class="pill">${esc(m.name)}</span>`).join(' ')}</p></details>` : ''}</div>`;
}

function logList(){
  const clans = S.clan==='alle' ? S.data.clans : [S.data.clans[S.clan]];
  return clans.map(c => `<div class="card"><h2>Protokoll ${esc(c.name)}</h2>${
    c.log.length ? `<ul class="list">${c.log.map(l=>`<li><span>${logText(l)} <span class="muted">RH${l.th??'?'}</span></span><span class="muted">${dateDE(l.time)}</span></li>`).join('')}</ul>`
    : '<span class="muted">Noch nichts.</span>'}</div>`).join('');
}

function detail(tag, clanName){
  const c = S.data.clans.find(c => c.name===clanName) || S.data.clans[0];
  const m = c.memberList.find(m => m.tag===tag); if(!m) return;
  const w = m.war||{}, p = m.profile||{};
  const heroes = Object.entries(p.heroes||{}).map(([k,v])=>`<span>${esc(k)}</span><span>${v}</span>`).join('');
  const dlg = document.getElementById('dlg');
  dlg.innerHTML = `<button class="close" aria-label="Schließen">×</button>
    <h3>${esc(m.name)}</h3><div class="sub">${esc(m.tag)} · ${ROLE[m.role]||'Mitglied'} · ${esc(c.name)}</div>
    <div class="dl">
      <span>Rathaus</span><span>${m.th}</span>
      <span>Erfahrungslevel</span><span>${m.exp}</span>
      <span>Trophäen / Liga</span><span>${fmtN(m.trophies)} · ${esc(m.league||'')}</span>
      <span>Kriegsbereitschaft</span><span>${p.warPreference==='in'?'dabei':p.warPreference==='out'?'ausgesetzt':'–'}</span>
      <span>Kriegssterne gesamt</span><span>${fmtN(p.warStars)}</span>
      <span>Erfasste Kriege</span><span>${w.wars||0} (davon Liga ${w.cwlWars||0})</span>
      <span>Angriffe vergessen gesamt</span><span>${w.missed||0}${w.lastMissed?' · zuletzt '+dateDE(w.lastMissed):''}</span>
      <span>3 Sterne gegen gleiches RH</span><span>${w.sameThAttacks? pct(w.sameThTriples,w.sameThAttacks)+' % ('+w.sameThTriples+'/'+w.sameThAttacks+')':'–'}</span>
      <span>Ø Zerstörung</span><span>${w.attacks?(w.pct/w.attacks).toFixed(1)+' %':'–'}</span>
      <span>Angriffssiege (Saison)</span><span>${fmtN(p.attackWins)}</span>
      <span>Verteidigungen im Krieg</span><span>${w.defs? w.defs+' · Ø '+(w.defStars/w.defs).toFixed(2)+' Sterne kassiert':'–'}</span>
      <span>Hauptstadtgold gespendet</span><span>${fmtN(p.capitalContrib)}${m.capitalWeek?' · diese Woche '+fmtN(m.capitalWeek):''}</span>
      <span>Aktive Supertruppen</span><span>${(m.boosts||[]).map(esc).join(', ')||'–'}</span>
      <span>Spenden Vorsaison</span><span>${m.donationsPrev?fmtN(m.donationsPrev[0].d)+' / '+fmtN(m.donationsPrev[0].r):'–'}</span>
      <span>Im Clan seit</span><span>${joinDE(m)}${m.joins>1?' ('+m.joins+'. Beitritt)':''}</span>
      <span>Zuletzt aktiv</span><span>${m.lastActive?ago(m.lastActive):'noch offen'}</span>
      ${heroes}
    </div>`;
  dlg.querySelector('.close').onclick = () => dlg.close();
  dlg.showModal();
}

function render(){
  renderTabs();
  const app = document.getElementById('app');
  let html = '';
  if(S.clan !== 'alle'){ const c=S.data.clans[S.clan]; html += clanHead(c) + liveWar(c); }
  else html += S.data.clans.map(liveWar).join('');
  // Reiter (Sven, 11.11.): Bonus eigener Reiter, Clanstadt/Clanspiele/Protokoll unter "Mehr"
  const views = [['mitglieder','Mitglieder'],['kriege','Kriege'],['liga','Liga'],['bonus','Bonus'],['mehr','Mehr']];
  const fns = {mitglieder:memberTable, kriege:warList, liga:cwlView, bonus:bonusView, mehr:moreView};
  if(!fns[S.view]) S.view = ['clanstadt','clanspiele','log'].includes(S.view) ? 'mehr' : 'mitglieder';
  html += `<div class="tabs" id="viewTabs">${views.map(([k,l])=>`<button data-v="${k}" class="${S.view===k?'on':''}">${l}</button>`).join('')}</div>`;
  html += fns[S.view]();
  app.innerHTML = html;
  app.querySelectorAll('details[data-more]').forEach(d => d.ontoggle = () => { S.more = Object.assign({}, S.more, {[d.dataset.more]: d.open}); });
  app.querySelector('#viewTabs').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.view=b.dataset.v; save(); render(); };
  const th = app.querySelector('thead');
  if(th) th.onclick = e => { const h=e.target.closest('th'); if(!h) return; const k=h.dataset.k;
    S.sort = S.sort.key===k ? {key:k,dir:-S.sort.dir} : {key:k,dir:(k==='name'?1:-1)}; save(); render(); };
  fdEvents(app);
  const tb = app.querySelector('tbody:not(.fdedit)');
  if(tb) tb.onclick = e => { const tr=e.target.closest('tr'); if(tr) detail(tr.dataset.tag, tr.dataset.clan); };
  const q = app.querySelector('#q');
  if(q) q.oninput = () => { S.q=q.value; const pos=q.selectionStart; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); };
}

function save(){ try{ localStorage.setItem('clanboard', JSON.stringify({clan:S.clan, view:S.view, sort:S.sort})); }catch(e){} }
function restore(){ try{ Object.assign(S, JSON.parse(localStorage.getItem('clanboard')||'{}')); }catch(e){} }

// Erster Abruf des Boards: Wer da schon im Clan war, hat kein echtes Beitrittsdatum (die API liefert keins).
const BOARD_START = '2026-11-03T08:39:06Z';
const joinDE = m => m.joinedAt === BOARD_START ? 'vor 03.11.' : dateDE(m.joinedAt);

const LIVE_URL = 'https://clan-board-live.vercel.app/api/live';
const CLAN_FIELDS = ['name','members','level','points','warWins','warLosses','warTies','warWinStreak','isWarLogPublic'];

// Live-Daten (Krieg, Mitgliederliste) über den gespeicherten Verlauf legen
function mergeLive(live){
  live.clans.forEach(lc => {
    const c = S.data.clans.find(x => x.tag === lc.tag);
    if(!c || lc.error) return;
    CLAN_FIELDS.forEach(k => { if(lc[k] !== undefined) c[k] = lc[k]; });
    const alt = c.currentWar;
    c.currentWar = lc.currentWar;
    if(alt && lc.currentWar && alt.start === lc.currentWar.start && alt.members){
      const altDef = {}; alt.members.forEach(m => altDef[m.tag] = m.defenses);
      lc.currentWar.members.forEach(m => { if(m.defenses === undefined) m.defenses = altDef[m.tag]; });
    }
    const lp = lc.cwlPrep, cr = c.cwl && c.cwl.rounds;
    if(lp && cr){
      const r = cr.find(x => x.day === lp.day && x.state === 'preparation');
      if(r){ r.next = lp.next; r.lineup = {};lp.lineup.forEach(m => r.lineup[m.tag] = {att:[], def:null, name:m.name}); }
    }
    // Angriffe des laufenden Liga-Tags live übernehmen, sonst zählt die Aussetz-Empfehlung erst nach dem nächsten Verlauf-Abruf
    const lw = lc.currentWar;
    if(lw && lw.kind === 'cwl' && lw.state === 'inWar' && cr){
      const r = cr.find(x => x.state === 'inWar');
      if(r) lw.members.forEach(m => {
        const l = r.lineup[m.tag];
        if(l && m.attacks && m.attacks.length > l.att.length){ l.att = m.attacks.map(a => [a.stars, a.pct, a.defTh]); if(m.th) l.th = m.th; }
      });
    }
    const byTag = {}; c.memberList.forEach(m => byTag[m.tag] = m);
    c.memberList = lc.memberList.map(lm => Object.assign(
      {war:{}, raids:[], profile:{}, games:null, joinedAt:null, lastActive:null, joins:1},
      byTag[lm.tag] || {}, lm));
  });
}

const fmtT = s => parseT(s).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});

async function load(force){
  let live = null;
  const btn = document.getElementById('reload');
  btn.disabled = true; btn.textContent = 'Lädt …';
  try{
    const [r, br, lr] = await Promise.all([
      fetch('data/board.json?t=' + Date.now(), {cache:'no-store'}),
      fetch('data/fuehrung.json?t=' + Date.now(), {cache:'no-store'}).then(x => x.ok ? x.json() : {}).catch(() => ({})),
      fetch(force ? LIVE_URL + '?t=' + Date.now() : LIVE_URL, force ? {cache:'no-store'} : {}).then(x => x.ok ? x.json() : null).catch(() => null),
    ]);
    if(!r.ok) throw new Error(r.status);
    S.data = await r.json();
    live = lr;
    S.fd = br || {};
    S.pending = S.pending.filter(p => Date.now() - p.at < 10*60*1000);
    S.pending.forEach(p => p.apply());
    if(live && live.clans) mergeLive(live);
    if(S.clan!=='alle' && !S.data.clans[S.clan]) S.clan = 0;
    const hist = 'Verlauf ' + fmtT(S.data.generated) + ' (' + ago(S.data.generated) + ')';
    document.getElementById('updated').textContent = live
      ? 'Live: ' + fmtT(live.generated) + ' Uhr · ' + hist
      : 'Stand: ' + hist + ' · Live-Abfrage gerade nicht erreichbar';
    render();
  }catch(e){
    document.getElementById('updated').innerHTML = '<span class="err">Daten konnten nicht geladen werden.</span>';
  }
  btn.disabled = false; btn.textContent = 'Aktualisieren';
}
restore(); load(); setInterval(load, 2*60*1000);
